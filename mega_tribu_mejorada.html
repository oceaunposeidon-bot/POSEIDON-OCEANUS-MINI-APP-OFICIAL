<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGA TRIBU HISPANA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0D0D0D;color:#f6efdd;font-family:'Segoe UI',Arial,sans-serif}
header{background:#111;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #D4AF37;position:sticky;top:0}
.logo{color:#D4AF37;font-size:20px;font-weight:bold}
.hero{text-align:center;padding:50px 20px;background:radial-gradient(circle at top,#1a0a2e,#0D0D0D)}
.hero h1{font-size:clamp(28px,6vw,40px);color:#D4AF37}
.gods{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;padding:20px;max-width:1000px;margin:auto}
.god{background:#17121f;border:2px solid #D4AF37;border-radius:14px;padding:18px;text-align:center;cursor:pointer;transition:.2s}
.god:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(212,175,55,.3)}
.god b{display:block;color:#D4AF37;font-size:20px;margin-bottom:4px}
.section{padding:25px 20px;max-width:1000px;margin:auto}
h2{color:#D4AF37;text-align:center;margin-bottom:15px}
.paises{display:flex;gap:10px;overflow-x:auto;padding:10px 0}
.pais{min-width:100px;background:#17121f;border:1px solid #D4AF37;border-radius:10px;padding:10px;text-align:center}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.lv{background:#17121f;border:1px solid #D4AF37;border-radius:10px;padding:14px;text-align:center}
</style>
</head>
<body>
<header><div class="logo">MEGA TRIBU HISPANA</div></header>
<div class="hero">
  <h1>MEGA TRIBU HISPANA</h1>
  <p>Un movimiento sin fronteras</p>
</div>
<div class="gods">
  <div class="god" onclick="window.open('https://t.me/AresImperium_Bot')"><b>ARES</b>Captación</div>
  <div class="god" onclick="window.open('https://t.me/ApoloAureum_Bot')"><b>APOLO</b>Ingresos</div>
  <div class="god" onclick="window.open('https://t.me/HadesNoctis_Bot')"><b>HADES</b>Noticias</div>
  <div class="god" onclick="window.open('https://t.me/PoseidonOceanus_Bot')"><b>POSEIDÓN</b>Beneficios</div>
</div>
<div class="section">
  <h2>COMUNIDAD GLOBAL</h2>
  <div class="paises">
    <div class="pais">Colombia</div><div class="pais">Perú</div><div class="pais">México</div>
    <div class="pais">España</div><div class="pais">Chile</div><div class="pais">Argentina</div>
  </div>
</div>
<div class="section">
  <h2>NIVELES</h2>
  <div class="levels">
    <div class="lv"><b>Nivel 1</b><br>Talento</div>
    <div class="lv"><b>Nivel 2</b><br>Interacción</div>
    <div class="lv"><b>Nivel 3</b><br>Creador</div>
    <div class="lv"><b>Gratuito</b></div>
    <div class="lv"><b>Estándar</b></div>
    <div class="lv"><b>Premium</b></div>
    <div class="lv"><b>VIP</b></div>
  </div>
</div>
</body>
</html>
