    position: absolute; display: block;

    cursor: pointer; outline: none;
    transition: background-color .12s ease, box-shadow .12s ease;

  #ap-play { border-radius: 50%; }
  #ap-pausa {

    border-radius: 50%; display: none;
    align-items: center; justify-content: center; gap: 14%;
    pointer-events: none;

  #ap-tiempo {
    display: flex; align-items: center; justify-content: center;

    font-variant-numeric: tabular-nums; letter-spacing: 0;
    pointer-events: none;
  }
  #ap-tiempo span { display: inline-block; transform-origin: center; }
  #ap-pista { cursor: pointer; touch-action: none; }
  #ap-linea, #ap-lleno {
    position: absolute; left: 0; top: 50%; height: var(--grosor, 4px);
    transform: translateY(-50%); border-radius: 99px; pointer-events: none;
  }
  #ap-linea { width: 100%; }
  #ap-lleno { width: 0; }
  #ap-punto {
    position: absolute; top: 50%; left: 0;
    width: var(--punto, 14px); height: var(--punto, 14px);
    transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
  }
  #ap-onda { cursor: pointer; touch-action: none; }
  #ap-cursor {
    position: absolute; top: 4%; bottom: 4%; left: 0; width: 2px;

    if (clave.indexOf("pais:") === 0) {

      return n ? ENLACES.grupo.replace(/\/+$/, "") + "/" + n : ENLACES.grupo;

    if (!url) { decir("Muy pronto disponible"); return; }

    var esTelegram = /^https:\/\/t\.me\//i.test(url);
    if (enTelegram) {
      try {
        if (esTelegram) tg.openTelegramLink(url); else tg.openLink(url);

      } catch (e) {}
    }
    var v = window.open(url, "_blank", "noopener");
    if (!v) window.location.href = url;
  }

    try { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light"); } catch (e) {}

  function caja(el, x1, y1, x2, y2) {
    el.style.left = x1 + "%"; el.style.top = y1 + "%";
    el.style.width = (x2 - x1) + "%"; el.style.height = (y2 - y1) + "%";
  }

  function nuevo(tag, cls, id) {

    if (cls) el.className = cls;
    if (id) el.id = id;

  function mmss(s) {
    s = Math.max(0, Math.floor(s || 0));
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
  }
  function duracion() {

  }
  function pintarAudio() {
    var d = duracion(), t = audio.currentTime || 0, p = d ? Math.min(1, t / d) : 0;
    if (piezas.texto) {
      piezas.texto.textContent = mmss(t) + " / " + mmss(d);
      ajustarTiempo();
    }
    if (piezas.lleno) piezas.lleno.style.width = (p * 100) + "%";
    if (piezas.punto) piezas.punto.style.left = (p * 100) + "%";
    if (piezas.cursor) piezas.cursor.style.left = (p * 100) + "%";
    escena.classList.toggle("sonando", !audio.paused && !audio.ended);
    escena.classList.toggle("iniciado", t > 0 || !audio.paused);
    escena.classList.toggle("mudo", audio.muted);
    if (piezas.play) piezas.play.setAttribute("aria-label", audio.paused ? "Reproducir audio" : "Pausar audio");
    if (piezas.vol) piezas.vol.setAttribute("aria-label", audio.muted ? "Activar sonido" : "Silenciar");
  }
  function ajustarTiempo() {
    var c = piezas.tiempo, s = piezas.texto;
    if (!c || !s) return;
    var alto = c.clientHeight, ancho = c.clientWidth;
    if (!alto) return;
    s.style.transform = "none";
    c.style.fontSize = (alto * piezas.escalaTexto) + "px";
    var w = s.offsetWidth;
    if (w > ancho && w > 0) s.style.transform = "scaleX(" + (ancho / w) + ")";
  }

    });
    el.addEventListener("keydown", function (ev) {
      var paso = ev.key === "ArrowRight" ? 5 : ev.key === "ArrowLeft" ? -5 : 0;
      if (!paso) return;
      ev.preventDefault();
      audio.currentTime = Math.min(duracion(), Math.max(0, audio.currentTime + paso));
    });
  }

  function montarAudio(a) {
    piezas = { escalaTexto: a.escalaTexto || 1.3 };
    var parche, i;

    // parches que tapan lo dibujado que ahora es dinámico (hora y pista)
    for (i = 0; i < (a.parches || []).length; i++) {
      parche = nuevo("div", "ap ap-parche");
      caja(parche, a.parches[i][0], a.parches[i][1], a.parches[i][2], a.parches[i][3]);
      parche.style.background = a.parches[i][4];
      escena.appendChild(parche);
    }

    // botón reproducir / pausar
    var play = nuevo("button", "zona ap", "ap-play");
    play.type = "button";
    caja(play, a.play[0], a.play[1], a.play[2], a.play[3]);
    var pausa = nuevo("span", "", "ap-pausa");
    pausa.style.background = a.fondoPlay;
    pausa.appendChild(nuevo("i")); pausa.appendChild(nuevo("i"));
    play.appendChild(pausa);
    play.addEventListener("click", alternar);
    escena.appendChild(play);
    piezas.play = play;

    // hora real
    var tiempo = nuevo("div", "ap", "ap-tiempo");
    caja(tiempo, a.tiempo[0], a.tiempo[1], a.tiempo[2], a.tiempo[3]);
    var texto = nuevo("span");
    tiempo.appendChild(texto);
    escena.appendChild(tiempo);
    piezas.tiempo = tiempo; piezas.texto = texto;

    // pista con avance real
    if (a.pista) {
      var pista = nuevo("div", "ap", "ap-pista");
      caja(pista, a.pista[0], a.pista[1], a.pista[2], a.pista[3]);
      pista.setAttribute("role", "slider");
      pista.setAttribute("aria-label", "Avance del audio");
      pista.tabIndex = 0;
      var linea = nuevo("div", "", "ap-linea"), lleno = nuevo("div", "", "ap-lleno"), punto = nuevo("div", "", "ap-punto");
      linea.style.background = a.colorLinea;
      lleno.style.background = a.colorLleno;
      punto.style.background = a.colorPunto;
      punto.style.boxShadow = a.brilloPunto;
      pista.appendChild(linea); pista.appendChild(lleno); pista.appendChild(punto);
      escena.appendChild(pista);
      arrastrable(pista);
      piezas.pista = pista; piezas.lleno = lleno; piezas.punto = punto;
      piezas.grosor = a.grosor; piezas.tamPunto = a.tamPunto;
    }

    // onda: se puede tocar para adelantar; cursor de avance
    if (a.onda) {
      var onda = nuevo("div", "ap", "ap-onda");
      caja(onda, a.onda[0], a.onda[1], a.onda[2], a.onda[3]);
      if (a.cursorEnOnda) {
        var cursor = nuevo("div", "", "ap-cursor");
        onda.appendChild(cursor);
        piezas.cursor = cursor;
        arrastrable(onda);
      } else {
        onda.addEventListener("click", alternar);
      }
      escena.appendChild(onda);
    }

    // volumen (silenciar)
    var vol = nuevo("button", "zona ap", "ap-vol");
    vol.type = "button";
    caja(vol, a.vol[0], a.vol[1], a.vol[2], a.vol[3]);
    vol.appendChild(nuevo("span", "", "ap-mudo"));
    vol.addEventListener("click", function () { vibrar(); audio.muted = !audio.muted; pintarAudio(); });
    escena.appendChild(vol);
    piezas.vol = vol;
  }

  /* ---------- montaje del diseño ---------- */
  function montar(nombre) {
    var d = DISENOS[nombre], i, z, el;
    activo = nombre;
    while (escena.children.length > 1) escena.removeChild(escena.lastChild);
    lienzo.src = d.img;
    fondo.style.backgroundImage = "url(" + d.img + ")";
    for (i = 0; i < d.zonas.length; i++) {
      z = d.zonas[i];
      el = nuevo("a", "zona");
      el.href = destino(z[0]) || "#";
      el.setAttribute("aria-label", z[5]);
      el.setAttribute("data-clave", z[0]);
      el.rel = "noopener";
      caja(el, z[1], z[2], z[3], z[4]);
      if (z[6]) el.style.borderRadius = z[6];
      escena.appendChild(el);
    }
    montarAudio(d.audio);
    pintarAudio();
  }

  escena.addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest("a.zona") : null;
    if (!a) return;
    ev.preventDefault();
    vibrar();
    abrir(destino(a.getAttribute("data-clave")));
  });

  /* ---------- tamaño: la imagen completa, sin deformar ---------- */
  function medir() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var w = DISENOS.web, m = DISENOS.movil;
    // se elige el diseño que más pantalla aprovecha
    var aw = Math.min(vw, vh * w.ancho / w.alto), am = Math.min(vw, vh * m.ancho / m.alto);
    var areaW = aw * aw * w.alto / w.ancho, areaM = am * am * m.alto / m.ancho;
    var nombre = areaW >= areaM ? "web" : "movil";
    var d = DISENOS[nombre];
    var ancho = nombre === "web" ? aw : am;
    // en teléfono, el diseño móvil usa todo el ancho (se desliza si es más alto)
    if (nombre === "movil" && vw <= 720) ancho = vw;
    ancho = Math.round(ancho);
    escena.style.width = ancho + "px";
    escena.style.height = Math.round(ancho * d.alto / d.ancho) + "px";
    if (nombre !== activo) montar(nombre);
    if (piezas.pista) {
      piezas.pista.style.setProperty("--grosor", Math.max(2, ancho * piezas.grosor / 100) + "px");
      piezas.pista.style.setProperty("--punto", Math.max(8, ancho * piezas.tamPunto / 100) + "px");
    }
    ajustarTiempo();
  }

  ["timeupdate", "play", "pause", "ended", "loadedmetadata", "durationchange", "volumechange", "seeked"]
    .forEach(function (n) { audio.addEventListener(n, pintarAudio); });
  audio.addEventListener("error", function () { decir("No se encontró el audio"); });

  window.addEventListener("resize", medir);
  window.addEventListener("orientationchange", medir);
  if (tg && tg.onEvent) { try { tg.onEvent("viewportChanged", medir); } catch (e) {} }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustarTiempo);
  medir();
})();
</script>
